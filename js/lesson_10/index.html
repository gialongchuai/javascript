<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <form action="" method="POST" class="form" id="form-1">
            <h3 class="heading">Thành viên đăng ký</h3>
            <p class="desc">Cùng nhau học lập trình miễn phí tại F8 ❤️</p>

            <div class="spacer"></div>

            <div class="form-group">
                <label for="fullname" class="form-label">Tên đầy đủ</label>
                <input id="fullname" name="fullname" type="text" placeholder="VD: Sơn Đặng" class="form-control">
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="text" placeholder="VD: email@domain.com" class="form-control">
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mật khẩu</label>
                <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" class="form-control">
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label for="password_confirmation" class="form-label">Nhập lại mật khẩu</label>
                <input id="password_confirmation" name="password_confirmation" placeholder="Nhập lại mật khẩu" type="password" class="form-control">
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label for="avatar" class="form-label">Ảnh đại diện</label>
                <input id="avatar" name="avatar" type="file" placeholder="Chọn ảnh đại diện" class="form-control">
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label for="province" class="form-label">Vui lòng chọn tỉnh/thành phố</label>
                <select name="province" id="province" style="margin-top: 5px; height: 30px;">
                    <option value="">--Chọn tỉnh/thành phố--</option>
                    <option value="hochiminh">Hồ Chí Minh</option>
                    <option value="hanoi">Hà Nội</option>
                </select>
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Giới tính</label>
                <div style="display: flex; margin-left: 20px; font-size: 12px;">
                    <input name="gender" value="male" type="radio"> Nam
                    <input name="gender" value="female" type="radio" style="margin-left: 20px;"> Nữ
                    <input name="gender" value="other" type="radio" style="margin-left: 20px;"> Khác
                </div>
                <span class="form-message"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Mức độ hài lòng của bạn</label>
                <div style="display: flex; margin-left: 20px; font-size: 12px;">
                    <input name="feeling" value="ratthich" type="checkbox"> Rất thích
                    <input name="feeling" value="tuyetvoi" type="checkbox" style="margin-left: 20px;"> Tuyệt vời
                    <input name="feeling" value="luon" type="checkbox" style="margin-left: 20px;"> Lượn
                </div>
                <span class="form-message"></span>
            </div>

            <button class="form-submit">Đăng ký</button>
        </form>
    </div>
</div>

<script src="./main.js"></script>

<script>
    Validator({
        form: '#form-1',
        formMessage: '.form-message',
        formGroup: '.form-group',
        rules: [
            Validator.isRequired('#fullName'),
            Validator.isRequired('#email'),
            Validator.isEmail('#email'),
            Validator.isRequired('#password'),
            Validator.minLength('#password', 6),
            Validator.isRequired('#password_confirmation'),
            Validator.isConfirmed('#password_confirmation', function() {
                return document.querySelector('#form-1 #password').value;
            }, 'Mật khẩu nhập lại không chính xác'),
            Validator.isRequired('#avatar'),
            Validator.isRequired('#province'),
            Validator.isRequired('input[name="gender"]'),
            Validator.isRequired('input[name="feeling"]')
        ],
        onSubmit: function(data) {
            console.log(data);            
        }
    });
</script>

</body>
</html>
